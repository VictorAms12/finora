name: stickerfast
description: Criador rapido de figurinhas para WhatsApp.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  image: ^4.12.0
  path_provider: ^2.1.5
  google_mlkit_selfie_segmentation: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
