name: Compilar Finora Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finora-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Verificar e compilar Windows
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolver versão do app
        shell: pwsh
        run: |
          $line = Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*(.+)$'
          if (-not $line) { throw 'Versão não encontrada no pubspec.yaml.' }
          $fullVersion = $line.Matches[0].Groups[1].Value.Trim()
          $versionName = $fullVersion.Split('+')[0]
          "FINORA_VERSION=$versionName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Versão detectada: $versionName"

      - name: Gerar estrutura Windows
        run: flutter create . --platforms=windows --project-name=finora --org=com.finora

      - name: Configurar Windows
        shell: pwsh
        run: ./tool/configure_windows.ps1

      - name: Aplicar identidade visual Finora
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tool/generate_branding.py

      - name: Remover teste padrão
        shell: pwsh
        run: |
          if (Test-Path 'test/widget_test.dart') {
            Remove-Item 'test/widget_test.dart' -Force
          }

      - name: Baixar dependências
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        run: flutter test

      - name: Compilar Windows Release
        run: flutter build windows --release

      - name: Empacotar versão portátil
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (!(Test-Path $release)) { throw 'Pasta Release do Windows não encontrada.' }

          $folder = "dist/Finora-Windows-v$env:FINORA_VERSION"
          $zip = "dist/Finora-Windows-v$env:FINORA_VERSION.zip"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item "$release/*" $folder -Recurse -Force

          @"
          FINORA WINDOWS v$env:FINORA_VERSION

          1. Extraia toda a pasta antes de executar.
          2. Abra Finora.exe.
          3. Mantenha DLLs e a pasta data ao lado do executável.
          4. Os dados desta instalação ficam armazenados localmente no Windows.
          5. Use Configurações > Backup e recuperação para copiar/restaurar seus dados.
          "@ | Set-Content "$folder/LEIA-ME.txt"

          Compress-Archive -Path "$folder/*" -DestinationPath $zip -Force

      - name: Publicar Finora Windows
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Finora-Windows-v${{ env.FINORA_VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: dist/Finora-Windows-v${{ env.FINORA_VERSION }}.zip
