name: Compilar Finora Android compatível

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finora-android-compatible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e gerar APK compatível
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório com histórico
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolver versão do app
        shell: bash
        run: |
          FULL_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          VERSION_NAME=${FULL_VERSION%%+*}
          echo "FINORA_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Versão detectada: $VERSION_NAME"

      - name: Gerar estrutura Android
        run: flutter create . --platforms=android --project-name=finora --org=com.finora

      - name: Recuperar assinatura histórica compatível
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          git show 81cc038ce6e8a1c4af41c4ff54b11e76321a47ee:android/keystore/finora-dev.jks > android/app/finora-release.jks
          cat > android/key.properties <<'EOF'
          storePassword=FinoraDev2026!
          keyPassword=FinoraDev2026!
          keyAlias=finora
          storeFile=finora-release.jks
          EOF

          keytool -list -v \
            -keystore android/app/finora-release.jks \
            -storepass 'FinoraDev2026!' \
            -alias finora | tee /tmp/finora-key.txt

          grep -q '3B:9F:57:35:03:3F:60:F9:B5:FB:28:6C:F5:24:0A:3B:FB:8C:91:B2:D8:01:E3:52:BA:8E:8E:AF:EF:DE:5F:34' /tmp/finora-key.txt
          echo 'Fingerprint histórico confirmado.'

      - name: Configurar Android
        run: python tool/configure_android.py

      - name: Verificar permissão de internet
        shell: bash
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Aplicar identidade visual Finora
        run: |
          python -m pip install --quiet pillow
          python tool/generate_branding.py

      - name: Remover teste padrão
        run: rm -f test/widget_test.dart

      - name: Baixar dependências
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        run: flutter test

      - name: Compilar APK Release compatível
        run: flutter build apk --release

      - name: Verificar assinatura do APK final
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-cert.txt
          grep -q '3b9f5735033f60f9b5fb286cf5240a3bfb8c91b2d801e352ba8e8eafefde5f34' /tmp/apk-cert.txt

      - name: Publicar APK instalável
        uses: actions/upload-artifact@v4
        with:
          name: Finora-v${{ env.FINORA_VERSION }}-APK-COMPATIVEL
          if-no-files-found: error
          retention-days: 7
          path: build/app/outputs/flutter-apk/app-release.apk
