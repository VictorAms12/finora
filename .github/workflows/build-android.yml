name: Compilar Finora Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Verificar e compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: flutter create . --platforms=android --project-name=finora --org=com.finora

      - name: Remover teste padrão do flutter create
        run: rm -f test/widget_test.dart

      - name: Baixar dependências
        run: flutter pub get

      - name: Verificar sintaxe e análise estática
        run: flutter analyze

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Finora-APK-v0.2.2
          if-no-files-found: error
          retention-days: 14
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Compilar AAB Release
        continue-on-error: true
        run: flutter build appbundle --release

      - name: Publicar AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Finora-AAB-v0.2.2
          if-no-files-found: ignore
          retention-days: 14
          path: build/app/outputs/bundle/release/app-release.aab
