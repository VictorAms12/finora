name: Compilar Finora Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finora-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verificar e compilar Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: flutter create . --platforms=android --project-name=finora --org=com.finora

      - name: Configurar Android, backup e assinatura estável
        shell: python
        run: |
          from pathlib import Path
          import re

          activity = Path('android/app/src/main/kotlin/com/finora/finora/MainActivity.kt')
          activity.parent.mkdir(parents=True, exist_ok=True)
          activity.write_text('''package com.finora.finora

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          ''', encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = '''
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          '''
          if 'android.permission.USE_BIOMETRIC' not in text:
              text = text.replace('>', '>' + permissions, 1)
          if 'android:allowBackup=' not in text:
              text = text.replace('<application', '<application\n        android:allowBackup="true"', 1)
          receivers = '''
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in text:
              text = text.replace('</application>', receivers + '\n    </application>')
          manifest.write_text(text, encoding='utf-8')

          for style_path in [
              Path('android/app/src/main/res/values/styles.xml'),
              Path('android/app/src/main/res/values-night/styles.xml'),
          ]:
              if not style_path.exists():
                  continue
              style = style_path.read_text(encoding='utf-8')
              style = re.sub(
                  r'(<style name="(?:LaunchTheme|NormalTheme)" parent=")[^"]+("[^>]*>)',
                  r'\1Theme.AppCompat.DayNight.NoActionBar\2',
                  style,
              )
              style_path.write_text(style, encoding='utf-8')

          gradle = Path('android/app/build.gradle.kts')
          app = gradle.read_text(encoding='utf-8')
          app = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', app)
          app = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', app)
          if 'isCoreLibraryDesugaringEnabled' not in app:
              app = app.replace(
                  'compileOptions {',
                  'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          app = re.sub(
              r'sourceCompatibility\s*=\s*JavaVersion\.VERSION_\d+',
              'sourceCompatibility = JavaVersion.VERSION_17',
              app,
          )
          app = re.sub(
              r'targetCompatibility\s*=\s*JavaVersion\.VERSION_\d+',
              'targetCompatibility = JavaVersion.VERSION_17',
              app,
          )
          app = re.sub(
              r'jvmTarget\s*=\s*JavaVersion\.VERSION_\d+\.toString\(\)',
              'jvmTarget = JavaVersion.VERSION_17.toString()',
              app,
          )
          if 'multiDexEnabled = true' not in app:
              app = app.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        multiDexEnabled = true',
                  1,
              )
          if 'create("finoraRelease")' not in app:
              app = app.replace(
                  '    buildTypes {',
                  '''    signingConfigs {
                      create("finoraRelease") {
                          storeFile = file("../keystore/finora-dev.jks")
                          storePassword = "FinoraDev2026!"
                          keyAlias = "finora"
                          keyPassword = "FinoraDev2026!"
                      }
                  }

                  buildTypes {''',
                  1,
              )
          app = app.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("finoraRelease")',
          )
          app += '''

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
              implementation("androidx.appcompat:appcompat:1.7.1")
          }
          '''
          gradle.write_text(app, encoding='utf-8')

          settings = Path('android/settings.gradle.kts')
          if settings.exists():
              cfg = settings.read_text(encoding='utf-8')
              cfg = re.sub(
                  r'id\("com\.android\.application"\) version "[^"]+" apply false',
                  'id("com.android.application") version "8.11.1" apply false',
                  cfg,
              )
              settings.write_text(cfg, encoding='utf-8')

      - name: Verificar identidade da assinatura
        run: |
          keytool -list -v \
            -keystore android/keystore/finora-dev.jks \
            -storepass 'FinoraDev2026!' \
            -alias finora | tee signing.txt
          grep -q 'SHA256: 3B:9F:57:35:03:3F:60:F9:B5:FB:28:6C:F5:24:0A:3B:FB:8C:91:B2:D8:01:E3:52:BA:8E:8E:AF:EF:DE:5F:34' signing.txt

      - name: Aplicar identidade visual Finora
        run: |
          python -m pip install --quiet pillow
          python tool/generate_branding.py

      - name: Remover teste padrão
        run: rm -f test/widget_test.dart

      - name: Baixar dependências
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        run: flutter test

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Finora-APK-v0.3.8
          if-no-files-found: error
          retention-days: 14
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Compilar AAB Release
        run: flutter build appbundle --release

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Finora-AAB-v0.3.8
          if-no-files-found: error
          retention-days: 14
          path: build/app/outputs/bundle/release/app-release.aab
