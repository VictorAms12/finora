name: Compilar Finora Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finora-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verificar e compilar Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolver versão do app
        shell: bash
        run: |
          FULL_VERSION=$(awk '/^version:/{print $2}' pubspec.yaml)
          VERSION_NAME=${FULL_VERSION%%+*}
          echo "FINORA_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Versão detectada: $VERSION_NAME"

      - name: Gerar estrutura Android
        run: flutter create . --platforms=android --project-name=finora --org=com.finora

      - name: Preparar assinatura
        id: signing
        shell: bash
        env:
          FINORA_KEYSTORE_BASE64: ${{ secrets.FINORA_KEYSTORE_BASE64 }}
          FINORA_KEYSTORE_PASSWORD: ${{ secrets.FINORA_KEYSTORE_PASSWORD }}
          FINORA_KEY_ALIAS: ${{ secrets.FINORA_KEY_ALIAS }}
          FINORA_KEY_PASSWORD: ${{ secrets.FINORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app

          HAS_ANY_SECRET=false
          for value in "$FINORA_KEYSTORE_BASE64" "$FINORA_KEYSTORE_PASSWORD" "$FINORA_KEY_ALIAS" "$FINORA_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then HAS_ANY_SECRET=true; fi
          done

          if [[ "$HAS_ANY_SECRET" == "true" ]]; then
            if [[ -z "$FINORA_KEYSTORE_BASE64" || -z "$FINORA_KEYSTORE_PASSWORD" || -z "$FINORA_KEY_ALIAS" || -z "$FINORA_KEY_PASSWORD" ]]; then
              echo "Os secrets de assinatura estão incompletos. Configure os quatro secrets FINORA_* descritos em docs/SIGNING.md."
              exit 1
            fi

            printf '%s' "$FINORA_KEYSTORE_BASE64" | base64 --decode > android/app/finora-release.jks
            cat > android/key.properties <<EOF
          storePassword=$FINORA_KEYSTORE_PASSWORD
          keyPassword=$FINORA_KEY_PASSWORD
          keyAlias=$FINORA_KEY_ALIAS
          storeFile=finora-release.jks
          EOF
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Assinatura estável carregada por GitHub Secrets."
          else
            keytool -genkeypair \
              -keystore android/app/ci-ephemeral.jks \
              -storepass 'FinoraCIOnly2026!' \
              -keypass 'FinoraCIOnly2026!' \
              -alias finora-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 2 \
              -dname 'CN=Finora CI, OU=CI, O=Finora, C=BR' \
              -noprompt
            cat > android/key.properties <<'EOF'
          storePassword=FinoraCIOnly2026!
          keyPassword=FinoraCIOnly2026!
          keyAlias=finora-ci
          storeFile=ci-ephemeral.jks
          EOF
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum secret de assinatura configurado: usando chave efêmera somente para validar a compilação."
          fi

      - name: Configurar Android
        run: python tool/configure_android.py

      - name: Verificar permissão de internet
        shell: bash
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Verificar assinatura estável
        if: steps.signing.outputs.stable == 'true'
        shell: bash
        env:
          FINORA_KEYSTORE_PASSWORD: ${{ secrets.FINORA_KEYSTORE_PASSWORD }}
          FINORA_KEY_ALIAS: ${{ secrets.FINORA_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/finora-release.jks \
            -storepass "$FINORA_KEYSTORE_PASSWORD" \
            -alias "$FINORA_KEY_ALIAS" | grep -E 'Alias name:|SHA256:'

      - name: Aplicar identidade visual Finora
        run: |
          python -m pip install --quiet pillow
          python tool/generate_branding.py

      - name: Remover teste padrão
        run: rm -f test/widget_test.dart

      - name: Baixar dependências
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        run: flutter test

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Compilar AAB Release
        run: flutter build appbundle --release

      - name: Avisar sobre build efêmera
        if: steps.signing.outputs.stable != 'true'
        shell: bash
        run: |
          {
            echo '### Android compilado com assinatura efêmera de CI'
            echo ''
            echo 'O APK/AAB abaixo é adequado para teste e instalação manual, mas a chave é descartável e não deve ser usada como baseline de atualização de uma release de produção.'
            echo 'Configure os secrets descritos em `docs/SIGNING.md` para publicar releases instaláveis e atualizáveis com assinatura estável.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        if: steps.signing.outputs.stable == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Finora-APK-v${{ env.FINORA_VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar AAB
        if: steps.signing.outputs.stable == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Finora-AAB-v${{ env.FINORA_VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publicar APK CI efêmero
        if: steps.signing.outputs.stable != 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Finora-APK-v${{ env.FINORA_VERSION }}-ci-ephemeral
          if-no-files-found: error
          retention-days: 14
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar AAB CI efêmero
        if: steps.signing.outputs.stable != 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Finora-AAB-v${{ env.FINORA_VERSION }}-ci-ephemeral
          if-no-files-found: error
          retention-days: 14
          path: build/app/outputs/bundle/release/app-release.aab
