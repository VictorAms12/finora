name: Validar Finora v0.5 Copilot

on:
  push:
    branches:
      - feature/finora-v050-copilot
    paths:
      - .github/workflows/validate-v050.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/finora-v050-copilot

      - name: Corrigir lint final do roteador
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/ai/finance_ai.dart')
          s = p.read_text(encoding='utf-8')
          old = "    if (_hasAny(clean, ['cartao', 'fatura', 'limite']))\n      return AiAssistantIntent.cards;"
          new = "    if (_hasAny(clean, ['cartao', 'fatura', 'limite'])) {\n      return AiAssistantIntent.cards;\n    }"
          if old not in s:
              raise SystemExit('trecho alvo não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatar
        run: dart format lib/ai/finance_ai.dart

      - name: Analyzer
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Persistir versão validada
        run: |
          rm .github/workflows/validate-v050.yml
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add -A
          git commit -m "fix: complete Finora v0.5 Copilot validation"
          git push origin HEAD:feature/finora-v050-copilot
