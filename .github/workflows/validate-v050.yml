name: Validar Finora v0.5 Copilot

on:
  push:
    branches:
      - feature/finora-v050-copilot
    paths:
      - .github/workflows/validate-v050.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/finora-v050-copilot

      - name: Corrigir tipagem, sintaxe e lints do Copilot
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'lib/store_entities.dart': [
                  ('cleanLabel.length.clamp(0, 60))', 'cleanLabel.length.clamp(0, 60).toInt())'),
                  ('cleanValue.length.clamp(0, 240))', 'cleanValue.length.clamp(0, 240).toInt())'),
                  ('    if (defaults.any((value) => _normalizedName(value) == normalized)) return true;',
                   '    if (defaults.any((value) => _normalizedName(value) == normalized)) {\n      return true;\n    }'),
              ],
              'lib/ai/copilot.dart': [
                  ('(months ?? 6).clamp(1, 60),', '(months ?? 6).clamp(1, 60).toInt(),'),
                  ("(int.tryParse(monthsMatch?.group(1) ?? '') ?? 6).clamp(1, 24);", "(int.tryParse(monthsMatch?.group(1) ?? '') ?? 6).clamp(1, 24).toInt();"),
                  ("(int.tryParse(match.group(1) ?? '') ?? 1).clamp(1, 24);", "(int.tryParse(match.group(1) ?? '') ?? 1).clamp(1, 24).toInt();"),
                  ('          monthlyEquivalent += rule.amount * 52 / 12;\n        case RecurrenceFrequency.monthly:', '          monthlyEquivalent += rule.amount * 52 / 12;\n          break;\n        case RecurrenceFrequency.monthly:'),
                  ('          monthlyEquivalent += rule.amount;\n        case RecurrenceFrequency.yearly:', '          monthlyEquivalent += rule.amount;\n          break;\n        case RecurrenceFrequency.yearly:'),
                  ('          monthlyEquivalent += rule.amount / 12;\n      }', '          monthlyEquivalent += rule.amount / 12;\n          break;\n      }'),
              ],
              'lib/ai/finance_ai.dart': [
                  ("((result['operationMonths'] as num?)?.toInt() ?? 6).clamp(1, 60);", "((result['operationMonths'] as num?)?.toInt() ?? 6).clamp(1, 60).toInt();"),
                  ("final memories = store.data.copilotMemoryEnabled\n        ? store.data.copilotMemories\n            .toList()\n          ..sort((a, b) => b.updatedAt.compareTo(a.updatedAt))\n        : <CopilotMemoryItem>[];", "final memories = store.data.copilotMemoryEnabled\n        ? (store.data.copilotMemories.toList()\n          ..sort((a, b) => b.updatedAt.compareTo(a.updatedAt)))\n        : <CopilotMemoryItem>[];"),
                  ('    final clean = _fold(question);\n    final selected = store.selectedMonth;\n', '    final clean = _fold(question);\n'),
              ],
              'lib/ui/copilot_memory.dart': [
                  ("import 'common.dart';", "import 'common.dart';\nimport 'forms.dart';"),
              ],
              'test/ai_assistant_engine_test.dart': [
                  ('    final service = const FinoraAiService();', '    const service = FinoraAiService();'),
              ],
          }
          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatar arquivos alterados
        run: |
          dart format \
            lib/ai/copilot.dart \
            lib/ai/finance_ai.dart \
            lib/models.dart \
            lib/store_backup.dart \
            lib/store_entities.dart \
            lib/ui/ai_assistant.dart \
            lib/ui/ai_settings.dart \
            lib/ui/copilot_memory.dart \
            test/ai_assistant_engine_test.dart \
            test/copilot_engine_test.dart

      - name: Analyzer
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Commitar correções validadas
        run: |
          rm .github/workflows/validate-v050.yml
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add -A
          git commit -m "fix: harden Finora v0.5 Copilot"
          git push origin HEAD:feature/finora-v050-copilot
