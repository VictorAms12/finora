name: Validar Finora v0.5 Copilot

on:
  push:
    branches:
      - feature/finora-v050-copilot
    paths:
      - .github/workflows/validate-v050.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/finora-v050-copilot

      - name: Corrigir parser monetário e lint final
        run: |
          python - <<'PY'
          from pathlib import Path

          finance = Path('lib/ai/finance_ai.dart')
          text = finance.read_text(encoding='utf-8')
          old = "    if (_hasAny(clean, ['cartao', 'fatura', 'limite']))\n      return AiAssistantIntent.cards;"
          new = "    if (_hasAny(clean, ['cartao', 'fatura', 'limite'])) {\n      return AiAssistantIntent.cards;\n    }"
          if old in text:
              text = text.replace(old, new, 1)
          finance.write_text(text, encoding='utf-8')

          copilot = Path('lib/ai/copilot.dart')
          text = copilot.read_text(encoding='utf-8')
          old = "      r'r\\$\\s*([0-9]{1,3}(?:\\.[0-9]{3})*(?:,[0-9]{1,2})?|[0-9]+(?:[\\.,][0-9]{1,2})?)',"
          new = "      r'r\\$\\s*([0-9][0-9.,]*)',"
          if old not in text:
              raise SystemExit('regex monetária alvo não encontrada')
          copilot.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatar
        run: dart format lib/ai/copilot.dart lib/ai/finance_ai.dart

      - name: Analyzer
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Persistir versão validada
        run: |
          rm .github/workflows/validate-v050.yml
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add -A
          git commit -m "fix: complete Finora v0.5 Copilot validation"
          git push origin HEAD:feature/finora-v050-copilot
