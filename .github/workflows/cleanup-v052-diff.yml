name: Limpar diff Finora v0.5.2

on:
  push:
    branches:
      - feature/finora-v052-stateful-copilot

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[v052-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/finora-v052-stateful-copilot
          fetch-depth: 0

      - name: Restaurar arquivos sem alteração funcional
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            lib/ai/copilot.dart \
            lib/ai/gemini_service.dart \
            lib/local_database.dart \
            lib/main.dart \
            lib/notification_service.dart \
            lib/onboarding.dart \
            lib/security.dart \
            lib/sqlite_store.dart \
            lib/store_planning.dart \
            lib/store_transactions.dart \
            lib/theme.dart \
            lib/ui/accounts.dart \
            lib/ui/ai_settings.dart \
            lib/ui/categories_settings_v035.dart \
            lib/ui/common.dart \
            lib/ui/copilot_memory.dart \
            lib/ui/desktop_actions.dart \
            lib/ui/finora_logo.dart \
            lib/ui/forms.dart \
            lib/ui/forms_v035.dart \
            lib/ui/goals_reserves.dart \
            lib/ui/more.dart \
            lib/ui/notifications_insights.dart \
            lib/ui/planning.dart \
            lib/ui/reports.dart \
            lib/ui/reserve_forms.dart \
            test/future_transactions_test.dart \
            test/legacy_transfer_migration_test.dart \
            test/reserve_integrity_test.dart \
            test/sqlite_migration_test.dart \
            test/store_integrity_test.dart \
            test/v045_integrity_audit_test.dart

          rm -f .github/workflows/apply-v052-stateful-copilot.yml
          rm -f tool/apply_v052_stateful_copilot.py
          rm -f tool/finalize_v052_patch.py
          rm -f .github/workflows/cleanup-v052-diff.yml

      - name: Commitar limpeza
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Finora Copilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: keep v0.5.2 diff focused [v052-clean]'
          git push origin HEAD:feature/finora-v052-stateful-copilot
