name: Empacotar APKs Finora v0.4.1

on:
  push:
    branches: [agent/package-v041-apks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: flutter create . --platforms=android --project-name=finora --org=com.finora

      - name: Preparar assinatura temporária de compilação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          keytool -genkeypair \
            -keystore android/app/ci-ephemeral.jks \
            -storepass 'FinoraCIOnly2026!' \
            -keypass 'FinoraCIOnly2026!' \
            -alias finora-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=Finora CI, OU=CI, O=Finora, C=BR' \
            -noprompt
          cat > android/key.properties <<'EOF'
          storePassword=FinoraCIOnly2026!
          keyPassword=FinoraCIOnly2026!
          keyAlias=finora-ci
          storeFile=ci-ephemeral.jks
          EOF

      - name: Configurar Android
        run: python tool/configure_android.py

      - name: Verificar permissão de internet
        run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Aplicar identidade visual Finora
        run: |
          python -m pip install --quiet pillow
          python tool/generate_branding.py

      - name: Remover teste padrão e baixar dependências
        run: |
          rm -f test/widget_test.dart
          flutter pub get

      - name: Compilar APK universal
        run: flutter build apk --release

      - name: Compilar APKs por arquitetura
        run: flutter build apk --release --split-per-abi

      - name: Listar APKs
        run: ls -lah build/app/outputs/flutter-apk/

      - name: Publicar APKs temporários
        uses: actions/upload-artifact@v4
        with:
          name: Finora-v0.4.1-apks-para-reassinar
          retention-days: 1
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/*.apk
