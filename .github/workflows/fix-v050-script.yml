name: Corrigir aplicador v0.5

on:
  push:
    branches:
      - feature/finora-v050-copilot
    paths:
      - .github/workflows/fix-v050-script.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finora-v050-copilot
      - name: Corrigir delimitadores Python
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tool/apply_v050_copilot.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("ask_fn = r'''", 'ask_fn = r"""', 1)
          marker = "\n'''\ns = s[:start] + ask_fn + s[end:]"
          if marker not in s:
              raise SystemExit('fim do ask_fn não encontrado')
          s = s.replace(marker, '\n"""\ns = s[:start] + ask_fn + s[end:]', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/fix-v050-script.yml
      - name: Commit
        run: |
          git config user.name "VictorAms12"
          git config user.email "victoralexandresoaresmaranhao@gmail.com"
          git add -A
          git commit -m "fix: correct v0.5 patch runner"
          git push origin HEAD:feature/finora-v050-copilot
