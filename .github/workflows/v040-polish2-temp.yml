name: Polir v0.4 final temporariamente

on:
  push:
    branches:
      - agent/finora-v040-ai-sqlite

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/finora-v040-ai-sqlite
      - name: Aplicar polimento
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/finora_polish.py
          python /tmp/finora_polish.py
          dart format lib/ui/home_shell.dart lib/ui/settings_v038.dart || true
      - name: Commitar polimento
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Finora CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib README.md CHANGELOG.md
          git commit -m 'docs(v0.4): finaliza versão, configurações e migração SQLite'
          git push origin HEAD:agent/finora-v040-ai-sqlite
