name: Aplicar Finora v0.5.2 Stateful Copilot

on:
  push:
    branches:
      - feature/finora-v052-stateful-copilot

permissions:
  contents: write

concurrency:
  group: finora-v052-stateful-copilot-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v052-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar branch
        uses: actions/checkout@v5
        with:
          ref: feature/finora-v052-stateful-copilot
          fetch-depth: 0

      - name: Aplicar pacote v0.5.2
        run: |
          set -euo pipefail
          python tool/apply_v052_stateful_copilot.py
          python tool/finalize_v052_patch.py

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Formatar arquivos Dart
        run: dart format lib test

      - name: Commitar implementação
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Finora Copilot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git commit -m 'feat: Finora v0.5.2 stateful copilot [v052-applied]'
          git push origin HEAD:feature/finora-v052-stateful-copilot
