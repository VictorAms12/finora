name: Corrigir Finora v0.6 CI

on:
  push:
    branches: [feature/finora-v060-intelligence]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v060-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/finora-v060-intelligence
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Aplicar correções
        run: python tool/fix_v060_ci.py
      - name: Formatar arquivo alterado
        run: dart format lib/ui/intelligence_center.dart
      - name: Commitar
        shell: bash
        run: |
          git config user.name "Finora CI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/ui/intelligence_center.dart
          if git diff --cached --quiet; then
            echo "Nada para corrigir."
            exit 0
          fi
          git commit -m "fix: adapt Intelligence capture APIs [v060-fixed]"
          git push origin HEAD:feature/finora-v060-intelligence
