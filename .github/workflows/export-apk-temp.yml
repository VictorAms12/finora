name: Recuperar chave v0.3.8 temporariamente

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    name: Recuperar keystore histórica v0.3.8
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório com histórico
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extrair keystore da v0.3.8 e validar fingerprint
        shell: bash
        run: |
          set -euo pipefail
          git show 81cc038ce6e8a1c4af41c4ff54b11e76321a47ee:android/keystore/finora-dev.jks > finora-v038-old.jks
          keytool -list -v \
            -keystore finora-v038-old.jks \
            -storepass 'FinoraDev2026!' \
            -alias finora | tee signing-old.txt
          grep -q 'SHA256: 3B:9F:57:35:03:3F:60:F9:B5:FB:28:6C:F5:24:0A:3B:FB:8C:91:B2:D8:01:E3:52:BA:8E:8E:AF:EF:DE:5F:34' signing-old.txt

      - name: Publicar keystore histórica temporária
        uses: actions/upload-artifact@v4
        with:
          name: Finora-v038-old-keystore-recovery
          if-no-files-found: error
          retention-days: 1
          path: finora-v038-old.jks
