name: Exportar APK temporario

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK para assinatura local
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: flutter create . --platforms=android --project-name=finora --org=com.finora

      - name: Preparar assinatura temporaria de compilacao
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/app/ci-export.jks \
            -storepass 'FinoraCIExport2026!' \
            -keypass 'FinoraCIExport2026!' \
            -alias finora-ci-export \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=Finora CI Export, OU=CI, O=Finora, C=BR' \
            -noprompt
          cat > android/key.properties <<'EOF'
          storePassword=FinoraCIExport2026!
          keyPassword=FinoraCIExport2026!
          keyAlias=finora-ci-export
          storeFile=ci-export.jks
          EOF

      - name: Configurar Android
        run: python tool/configure_android.py

      - name: Aplicar identidade visual Finora
        run: |
          python -m pip install --quiet pillow
          python tool/generate_branding.py

      - name: Remover teste padrao
        run: rm -f test/widget_test.dart

      - name: Baixar dependencias
        run: flutter pub get

      - name: Verificar codigo
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        run: flutter test

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Preparar apksigner oficial
        shell: bash
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Build-tools: $BUILD_TOOLS"
          mkdir -p apksigner-export/lib
          cp "$BUILD_TOOLS/apksigner" apksigner-export/apksigner
          cp "$BUILD_TOOLS/lib/apksigner.jar" apksigner-export/lib/apksigner.jar
          chmod +x apksigner-export/apksigner

      - name: Publicar APK temporario
        uses: actions/upload-artifact@v4
        with:
          name: Finora-v0.3.9-unsigned-source
          if-no-files-found: error
          retention-days: 1
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar apksigner oficial
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-official
          if-no-files-found: error
          retention-days: 1
          path: apksigner-export/
